spring:
  application:
    name: group-service

  profiles:
    # Local development is the default; override with SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/splitexpense_group}
    username: ${DB_USERNAME:splitexpense}
    password: ${DB_PASSWORD:splitexpense}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: group-pool
      # Every apply retry re-enters the pool, so a contended group can hold a connection
      # for several short transactions in a row. Sized with headroom.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    # Flyway owns the schema. Hibernate only verifies that the mapped entities agree
    # with the migrated tables and fails fast at startup if they drift. Never `update`:
    # a schema this service derives money from must not change itself.
    hibernate:
      ddl-auto: validate
    # Keeping the persistence context open across view rendering hides lazy-loading
    # bugs and holds a connection for the whole request. Off, always.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty by default: a local Redis normally has no password set.
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}
  error:
    # Error bodies are produced by GlobalExceptionHandler; never leak the container's.
    include-message: never
    include-stacktrace: never

splitexpense:
  jwt:
    # This service VALIDATES only; it never mints a token. The secret and issuer must
    # match auth-service exactly or every request here fails signature verification.
    secret: ${JWT_SECRET:dev-secret-change-me-this-must-be-at-least-32-bytes-long}
    issuer: ${JWT_ISSUER:splitexpense-auth-service}

  cache:
    # Deliberately short. A group's balances are authoritative in Postgres, and the cache
    # exists to absorb read traffic, not to be a source of truth; 30s bounds how long a
    # reader can trail a committed write. See CacheConfig for the staleness discussion.
    balances-ttl: ${CACHE_BALANCES_TTL:30s}

  group:
    # Attempts per balance apply, including the first, before it is reported as contended.
    # Correctness never depends on this — an apply that exhausts its budget changed nothing
    # — but throughput on a busy group does. An apply is more exposed than a single-row
    # wallet movement was, because it touches one row per participant and loses if it
    # collides on any of them. See BalanceApplyService.
    apply-max-attempts: ${GROUP_APPLY_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.splitexpense.group: ${LOG_LEVEL:INFO}
