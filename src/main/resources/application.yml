spring:
  application:
    name: wallet-service

  profiles:
    # Local development is the default; override with SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow_wallet}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: wallet-pool
      # Every credit/debit retry re-enters the pool, so a wallet under contention can
      # hold a connection for several short transactions in a row. Sized with headroom.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    # Flyway owns the schema. Hibernate only verifies that the mapped entities agree
    # with the migrated tables and fails fast at startup if they drift. Never `update`:
    # a schema this service derives money from must not change itself.
    hibernate:
      ddl-auto: validate
    # Keeping the persistence context open across view rendering hides lazy-loading
    # bugs and holds a connection for the whole request. Off, always.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty by default: a local Redis normally has no password set.
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}
  error:
    # Error bodies are produced by GlobalExceptionHandler; never leak the container's.
    include-message: never
    include-stacktrace: never

payflow:
  jwt:
    # This service VALIDATES only; it never mints a token. The secret and issuer must
    # match auth-service exactly or every request here fails signature verification.
    secret: ${JWT_SECRET:dev-secret-change-me-this-must-be-at-least-32-bytes-long}
    issuer: ${JWT_ISSUER:payflow-auth-service}

  cache:
    # Deliberately short. A wallet balance is authoritative in Postgres, and the cache
    # exists to absorb read traffic, not to be a source of truth; 30s bounds how long a
    # reader can trail a committed write. See CacheConfig for the staleness discussion.
    balance-ttl: ${CACHE_BALANCE_TTL:30s}

  wallet:
    # Attempts per credit/debit, including the first, before a movement is reported as
    # contended. Correctness never depends on this — a movement that exhausts its budget
    # moved no money — but throughput on a hot wallet does. See WalletMovementService.
    movement-max-attempts: ${WALLET_MOVEMENT_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.payflow.wallet: ${LOG_LEVEL:INFO}
